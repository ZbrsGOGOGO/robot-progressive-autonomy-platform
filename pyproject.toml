[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-progressive-autonomy-platform"
version = "0.1.0"
description = "Device-agnostic teleoperation orchestration and episode tooling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rpa = "rpa_sdk.__main__:main"

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.setuptools.package-data]
rpa_sdk = ["workbench.html"]
